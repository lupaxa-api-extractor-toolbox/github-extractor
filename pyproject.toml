[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lupaxa-github-extractor"
version = "0.1.1"
description = "List GitHub organisations, repositories, and related data."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENCE"]
authors = [{ name = "The Lupaxa Project" }]
maintainers = [{ name = "The Lupaxa Project" }]
keywords = ["github", "extractor", "api"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
]
dependencies = ["requests>=2.32.0,<3.0.0"]

[project.optional-dependencies]
dev = [
  "bump-my-version>=1.2.0",
  "hatch>=1.12.0",
  "mypy>=1.17.0,<2.0.0",
  "pip-audit>=2.7.0",
  "pytest>=8.4.0,<9.0.0",
  "pytest-cov>=6.2.0,<7.0.0",
  "ruff>=0.12.0,<1.0.0",
]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.urls]
Homepage = "https://github.com/lupaxa-api-extractor-toolbox/github-extractor"
Repository = "https://github.com/lupaxa-api-extractor-toolbox/github-extractor"
Issues = "https://github.com/lupaxa-api-extractor-toolbox/github-extractor/issues"

[project.scripts]
github-extractor = "lupaxa.github_extractor.cli:main"

[tool.hatch.build.targets.sdist]
include = [
  "src/**",
  "README.md",
  "LICENCE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lupaxa"]

[tool.ruff]
target-version = "py311"
line-length = 200
src = [
  "src",
  "tests",
]
extend-exclude = [
  ".mypy_cache",
  ".pytest_cache",
  ".tox",
  ".venv",
  "build",
  "dist",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "S",
  "UP",
  "SIM",
  "C4",
  "ISC",
  "D",
  "ANN",
  "PT",
]
ignore = [
  "D200",
  "D201",
  "D202",
  "D203",
  "D204",
  "D205",
  "D206",
  "D207",
  "D208",
  "D209",
  "D210",
  "D211",
  "D212",
  "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "ANN",
  "D",
  "S101",
  "S105",
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
ignore-fully-untyped = false
mypy-init-return = true
suppress-dummy-args = false
suppress-none-returning = false

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["id"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
parametrize-names-type = "tuple"
parametrize-values-row-type = "tuple"
parametrize-values-type = "list"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"
multiline-quotes = "double"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["lupaxa"]
split-on-trailing-comma = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod"]
staticmethod-decorators = ["staticmethod"]

[tool.ruff.lint.pylint]
allow-dunder-method-names = []
max-args = 10
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = false

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 200
indent-style = "space"
line-ending = "lf"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
packages = ["lupaxa.github_extractor"]
strict = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
show_traceback = true
warn_unreachable = true
warn_unused_configs = true
exclude = ["^build/", "^dist/"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
  "--strict-config",
  "--strict-markers",
  "--showlocals",
  "--tb=short",
]
testpaths = ["tests"]
pythonpath = ["src"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
parallel = true
source = ["lupaxa.github_extractor"]

[tool.coverage.paths]
source = [
  "src/lupaxa/github_extractor",
  "*/site-packages/lupaxa/github_extractor",
]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == \"__main__\":",
  "raise AssertionError",
  "raise NotImplementedError",
]
fail_under = 90
precision = 2
show_missing = true
skip_covered = false
skip_empty = true

[tool.coverage.html]
directory = "coverage/html"

[tool.coverage.xml]
output = "coverage/coverage.xml"
